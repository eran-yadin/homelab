services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      # DNS_BIND_IP is decided at install time. On a host running
      # systemd-resolved, something already holds 127.0.0.53:53 (and often
      # 127.0.0.54:53), and binding 0.0.0.0:53 then fails with "address
      # already in use" -- intermittently, which is worse than always.
      # Binding the LAN address instead sidesteps it without touching resolved.
      - "${DNS_BIND_IP:-0.0.0.0}:53:53/tcp"
      - "${DNS_BIND_IP:-0.0.0.0}:53:53/udp"
      - "${ADGUARD_PORT:-3080}:3000"   # setup wizard, then the dashboard
    volumes:
      - work:/opt/adguardhome/work
      - conf:/opt/adguardhome/conf
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  work:
  conf:
