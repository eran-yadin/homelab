kind="compose"
title="AdGuard Home"
category="network"
desc="Network-wide ad and tracker blocking, and a local DNS server."
homepage="https://adguard.com/adguard-home.html"
ports="3080"
requires="docker"
stateful=1
needs_ram_mb=256
detect="container:adguard"
notes='Binds port 53, which collides with systemd-resolved on most desktops.
  On a server that is usually fine; if start fails with "address already in
  use", disable the DNSStubListener first. Setup wizard is on :3080.'
