services:
  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    restart: unless-stopped
    command: serve
    ports:
      - "${HEADSCALE_PORT:-8080}:8080"
      - "9090:9090"
    volumes:
      - ./config.yaml:/etc/headscale/config.yaml:ro
      - data:/var/lib/headscale
    # No healthcheck here: this image is distroless. It has no /bin/sh, no
    # wget and no curl, so every form of docker healthcheck fails with
    # "stat /bin/sh: no such file or directory" -- which reads as unhealthy
    # while the service is perfectly fine. app.conf declares health_url
    # instead and the engine probes it from the host.
volumes:
  data:
