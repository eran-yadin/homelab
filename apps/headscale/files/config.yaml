# Minimal headscale config. Change server_url to the address your other
# machines can actually reach, then: homelab restart headscale
server_url: http://127.0.0.1:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090

private_key_path: /var/lib/headscale/private.key
noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

dns:
  magic_dns: true
  base_domain: homelab.internal
  nameservers:
    global:
      - 1.1.1.1
      - 8.8.8.8

# Headscale refuses to start with an empty DERP map: "initial DERPMap is
# empty, Headscale requires at least one entry". DERP servers are the relays
# used when two machines cannot reach each other directly (strict NAT, mobile
# networks). Pointing at Tailscale's public relays is the default; running
# your own means embedding a derp.yaml here instead. Worth knowing that this
# is the one part of "self-hosted" that still leaves the house by default --
# relayed traffic is end-to-end encrypted, but it does transit their servers.
derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 24h

log:
  level: info
