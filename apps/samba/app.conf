kind="systemd"        # inherits start/stop/update/delete/status/backup/restore
unit="smbd.service"
title="Windows file shares (Samba)"
category="files"
desc="Folders on this box as network drives: \\\\<host>\\media, \\\\<host>\\share. Home network and tailnet only."
homepage="https://www.samba.org/"
ports="445"
web=0                 # SMB, not a web page: no caddy route, no Open link
stateful=1
needs_ram_mb=128
needs_disk_mb=256
detect="unit:smbd.service path:/etc/samba/homelab.conf"
backup_paths="/etc/samba /var/lib/samba/private"

notes='Shares are set in /etc/homelab/samba.conf (written once: media, share,
  and 3dmodels when that folder exists); `homelab update samba --apply`
  applies a change. One user, the box owner, with a generated password kept
  in /var/lib/homelab/apps/samba/.env (sudo cat it; change it with
  sudo smbpasswd <user>). Only the LAN and the tailnet are let in, by the
  firewall app and by Samba itself (hosts allow). SMB1 is off.'
