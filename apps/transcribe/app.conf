kind="compose"        # inherits download/start/stop/update/delete/status/backup/restore
title="Transcribe"
category="documents"
desc="Speech to text with faster-whisper. Hebrew-tuned model, runs on CPU."
homepage="https://github.com/eran-yadin/transcribe"
ports="8011"
requires="docker"
stateful=1
needs_ram_mb=2048
needs_disk_mb=4096
detect="container:transcribe"
health_url="http://127.0.0.1:8011/"   # python:slim base has no curl, so probe from the host
notes='The app is its own project now -- github.com/eran-yadin/transcribe --
  and this entry only deploys its published image. It used to carry the source
  here and build it on the target, which meant every install compiled
  faster-whisper on a 2-core i3, and the result was tagged :latest on an app
  holding data. The image is pinned in files/compose.yml; bump it there and
  run update. The image carries an OCI version label, so update reports a real
  version jump.

  The thread count was hardcoded to 3 for the NUC; download.sh derives it from
  the detected core count. The ~1.6 GB model cache lives in the data volume, so
  it survives an update and is only downloaded once -- on the first
  transcription, not at startup, and it needs internet that once.'
