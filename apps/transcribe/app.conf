kind="compose"
title="Transcribe"
category="documents"
desc="Speech to text with faster-whisper. Hebrew-tuned model, runs on CPU."
ports="8011"
requires="docker"
stateful=1
needs_ram_mb=2048
needs_disk_mb=4096
detect="container:transcribe"
health_url="http://127.0.0.1:8011/"   # python:slim base has no curl, so probe from the host
notes='Ported from nucserver. The thread count was hardcoded to 3 for that
  2-core i3; it is now derived from the detected core count. The ~1.5 GB model
  cache lives in the data volume, so it survives an update and is only
  downloaded once.'
