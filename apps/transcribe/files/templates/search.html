<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — Transcribe</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e8ec; --muted:#8b93a1; --accent:#4f9cf9;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 system-ui,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--text)}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px}
  .back{font-size:13px;color:var(--muted)}
  form.search{display:flex;gap:8px;margin:14px 0 20px}
  form.search input{flex:1;background:var(--panel2);border:1px solid var(--border);
       color:var(--text);border-radius:8px;padding:9px 12px;font-size:14px}
  .btn{background:var(--accent);color:#06101f;border:0;border-radius:8px;
       padding:9px 16px;font-weight:600;cursor:pointer}
  .res{background:var(--panel);border:1px solid var(--border);border-radius:10px;
       padding:14px 16px;margin-bottom:12px}
  .res .name{font-weight:600;margin-bottom:4px}
  .snip{color:var(--muted);font-size:14px}
  .snip b,.snip [class]{color:var(--text)}
  mark,.snip :is(b){color:var(--accent);background:transparent;font-weight:600}
  .empty{color:var(--muted);text-align:center;padding:30px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← all recordings</a>
  <form class="search" action="/search" method="get">
    <input type="text" name="q" value="{{ q }}" placeholder="Search all transcripts…" autofocus>
    <button class="btn" type="submit">Search</button>
  </form>

  {% if q and results %}
    {% for r in results %}
      <a class="res" style="display:block" href="/transcript/{{ r.id }}">
        <div class="name">{{ r.original_name }}</div>
        <div class="snip">{{ r.snip|replace('[','<b>')|replace(']','</b>')|safe }}</div>
      </a>
    {% endfor %}
  {% elif q %}
    <div class="empty">No matches for “{{ q }}”.</div>
  {% else %}
    <div class="empty">Type a word or phrase to search across every transcript.</div>
  {% endif %}
</div>
</body>
</html>
