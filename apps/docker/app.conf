kind="script"          # implements its own verbs: it is what everything else needs
title="Docker Engine"
category="base"
desc="Container runtime and compose plugin. Almost every other app needs this."
homepage="https://docs.docker.com/engine/"
detect="bin:docker unit:docker.service"
stateful=0
needs_disk_mb=1024
notes="Installed from Docker's own apt repository, not the distro package, so
  that the compose v2 plugin is included and versions stay current."
