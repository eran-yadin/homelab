kind="compose"
title="UT99"
category="gaming"
desc="Unreal Tournament 99 dedicated server (OldUnreal 469 patch), with its web admin for maps, kicks and bans."
homepage="https://github.com/PhasecoreX/docker-ut99-server"
ports="5080"            # web admin (tcp). The game itself is udp 7777-7781 + 8777
requires="docker"
stateful=1
needs_ram_mb=256
needs_disk_mb=1024
detect="container:ut99"
oneshot="init-perms"
notes='The first start downloads the 436 server, the bonus packs and the
  OldUnreal 469 patch (about 200 MB) into the data volume, so it takes a few
  minutes before the game and the web admin answer.

  Web admin: http://<box>:5080/ServerAdmin, user `admin`, password
  ADMIN_PASSWORD in the generated .env (the same password works in game:
  `adminlogin <password>` in the console). Plain HTTP and very old code: keep it
  on the LAN and tailnet, never through a tunnel.

  Players from outside: the box is behind CGNAT, so point a playit.gg UDP
  tunnel at 127.0.0.1:7777 (the playit agent runs on the host). No firewall
  change is needed for that, the tunnel is an outgoing connection.

  Server name, admin password and web admin port are written into
  UnrealTournament.ini on every start, from the .env; everything else in the
  ini is yours (it lives in the volume, under addons/System). Custom maps and
  mutators go in addons/ too.'
