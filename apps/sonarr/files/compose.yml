services:
  sonarr:
    image: docker.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Jerusalem}
    ports:
      - "8989:8989"
    volumes:
      - config:/config
      - ${MEDIA_DIR:-/srv/media}:/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
volumes:
  config:
