kind="systemd"
unit="homelab-hub.service"
title="Homelab Hub"
category="base"
desc="The web front end for this app store. Start, stop and install apps, watch the box, reboot it."
homepage=""
ports="7070"
requires="docker"
stateful=0
needs_ram_mb=128
detect="unit:homelab-hub.service path:/opt/homelab-hub/server.py"
purge_paths="/opt/homelab-hub /etc/sudoers.d/homelab-hub"
notes='Deploys the CLI to /opt/homelab and installs a sudoers rule scoped to
  that one binary, replacing the original hub wildcard rule for systemctl
  start/stop/restart, which was root-equivalent: systemctl will accept a path
  to any unit file, including one the caller just wrote.' 
