kind="compose"
title="Seerr"
category="media"
desc="Requests: family pick a movie or show, Seerr hands it to Radarr or Sonarr. Signs in with Jellyfin accounts."
homepage="https://docs.seerr.dev/"
ports="5055"
requires="docker"
stateful=1
needs_ram_mb=256
needs_disk_mb=512
detect="container:seerr"
oneshot="init-perms"
notes='First visit runs its setup: choose Jellyfin, server http://10.0.0.5:8096,
  sign in with the Jellyfin admin, then add Radarr (http://10.0.0.5:7878) and
  Sonarr (http://10.0.0.5:8989) with their API keys (each app: Settings >
  General). Family then log in with their own Jellyfin accounts.'
