kind="compose"
title="Radarr"
category="jellyfin"   # Jellyfin and its download stack, grouped on the hub
desc="Movies: finds, downloads (through qBittorrent) and files them into Jellyfin's Movies folder."
homepage="https://radarr.video/"
ports="7878"
requires="docker"
stateful=1
needs_ram_mb=256
needs_disk_mb=1024
detect="container:radarr"
notes='Part of the media stack, like home-server-kit: qBittorrent downloads,
  Prowlarr holds the sources, Radarr/Sonarr/Lidarr pick and file, Seerr takes
  requests, Jellyfin plays. Everything works in /media = MEDIA_DIR on the host
  (/srv/media), the same folder Jellyfin reads, so finished files are moved or
  hard-linked, never copied. Connect the apps to each other once in their
  Settings pages (see docs/COMMANDS.md, "Media stack").'
