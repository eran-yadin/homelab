services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
      # Client discovery: TVs and phone apps broadcast here to find the
      # server. The answer carries PUBLISHED_URL, because from inside the
      # container Jellyfin only knows its own 172.x address.
      - "7359:7359/udp"
    environment:
      JELLYFIN_PublishedServerUrl: ${PUBLISHED_URL:-}
    volumes:
      - config:/config
      - cache:/cache
      - ${MEDIA_DIR:-/srv/media}:/media:ro
    # No `devices:` here on purpose. Docker fails to start a container whose
    # device is missing, and most hosts have no /dev/dri. download.sh writes a
    # compose.override.yml adding it only when the hardware is actually there.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
volumes:
  config:
  cache:
