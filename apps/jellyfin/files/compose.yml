services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    # Host networking, as on home-server-kit. TVs and phone apps find the
    # server with a UDP broadcast to port 7359, and docker's port publishing
    # does not pass broadcasts on: from the LAN a direct question got an
    # answer and a broadcast got none (nucserver, 2026-11-28). On the host
    # network Jellyfin hears them itself, and DLNA works too. Jellyfin
    # listens on 8096 (http) here; the firewall app keeps it to LAN + tailnet.
    network_mode: host
    environment:
      JELLYFIN_PublishedServerUrl: ${PUBLISHED_URL:-}
    volumes:
      - config:/config
      - cache:/cache
      - ${MEDIA_DIR:-/srv/media}:/media:ro
    # No `devices:` here on purpose. Docker fails to start a container whose
    # device is missing, and most hosts have no /dev/dri. download.sh writes a
    # compose.override.yml adding it only when the hardware is actually there.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
volumes:
  config:
  cache:
