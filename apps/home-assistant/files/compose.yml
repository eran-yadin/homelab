services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    restart: unless-stopped
    # Discovery protocols are broadcast/multicast; a bridge network hides them.
    network_mode: host
    privileged: true
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - config:/config
      - /run/dbus:/run/dbus:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8123 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
volumes:
  config:
