kind="compose"
title="Stremio Server"
category="media"
desc="Stremio's streaming backend. The server fetches and transcodes; your devices only play."
homepage="https://www.stremio.com/"
ports="11470"
requires="docker"
stateful=1
needs_ram_mb=1024
needs_disk_mb=8192
detect="container:stremio-server"
health_url="http://127.0.0.1:11470/settings"
notes='Point any Stremio client (desktop, phone, TV, or web.stremio.com) at
  this server, and the fetching and transcoding happen here instead of on the
  device. NO_CORS=1 is set because web.stremio.com is a different origin and
  the browser blocks it otherwise.

  Two things to know. This is the one closed-source app in the catalog: the
  addon SDK is open, the server and client are not. And what it streams comes
  from whichever third-party addons you add to your client, over your own
  connection -- unlike every other app here, which only serves files you
  already have.'
