services:
  stremio-server:
    # Pinned rather than :latest. This is the one closed-source component in
    # the catalog, so an unattended jump to a new build is not something to
    # find out about while watching something.
    image: stremio/server:v4.20.16
    container_name: stremio-server
    restart: unless-stopped
    ports:
      - "${STREMIO_HTTP_PORT:-11470}:11470"
      - "${STREMIO_HTTPS_PORT:-12470}:12470"
    environment:
      NO_CORS: ${NO_CORS:-1}
    volumes:
      # settings, generated certificates, and the stream cache
      - data:/root/.stremio-server
    # No devices: here. The bundled ffmpeg does software transcoding on any
    # host; download.sh adds /dev/dri via compose.override.yml when the box
    # actually has an Intel GPU, the same way jellyfin does.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:11470/settings >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  data:
