kind="systemd"
unit="ampinstmgr.service"
title="AMP"
category="gaming"
desc="CubeCoders AMP - game and application server manager. Minecraft, Source engine, and much else."
homepage="https://cubecoders.com/AMP"
ports="8080 8081"
stateful=1
needs_ram_mb=1024
needs_disk_mb=2048     # to install: AMP plus a JRE. Game instances need far more.
detect="unit:ampinstmgr.service bin:ampinstmgr"
conflicts="unit:nginx.service"
health_url="http://127.0.0.1:8080/"   # ampinstmgr.service exits after launching
                                      # instances, so the unit reads inactive
                                      # while the panel is serving happily
backup_paths="/home/amp/.ampdata"
notes='Installs through CubeCoders own getamp.sh, unattended. Two things to
  know before you run it. It downloads and executes a vendor script as root --
  that is their supported install path, and there is no package repository
  alternative. And AMP is proprietary: free for personal use, licensed beyond
  that, with the licence entered in the panel after install.

  Credentials are generated once into the app env file and printed at the end.
  If the unit is already present -- the usual case on a server that ran AMP
  before this catalog -- install adopts it and changes nothing.

  delete stops and disables AMP but will not remove /home/amp, because that is
  where every game server it manages keeps its worlds and saves.

  needs_disk_mb is the install footprint, not a sizing recommendation. Each
  game instance AMP creates lands under /home/amp and a single modded
  Minecraft server can outgrow that many times over.'
