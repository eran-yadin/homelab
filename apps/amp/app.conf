kind="systemd"
unit="ampinstmgr.service"
adopted=1              # already on nucserver; homelab controls it, did not install it
title="AMP"
category="gaming"
desc="CubeCoders AMP - game and application server manager."
homepage="https://cubecoders.com/AMP"
ports="8080 8081"
stateful=1
detect="unit:ampinstmgr.service"
notes='Adopt-only. AMP installs itself through its own installer and manages
  its own game instances, so homelab will start, stop and watch it but will
  never install or remove it. Its panel is plain HTTP on the LAN; putting it
  behind caddy is worth doing.'
