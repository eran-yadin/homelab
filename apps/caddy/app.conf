kind="compose"
title="Caddy"
category="ops"
desc="Reverse proxy. Gives every app a name instead of a port, with HTTPS."
homepage="https://caddyserver.com/"
ports="80 443"
requires="docker"
stateful=1
needs_ram_mb=128
detect="container:caddy"
conflicts="unit:nginx.service"   # both want :80; nucserver runs nginx today
notes='Per-app routes go in files/sites/*.caddy, which is mounted in. The
  default config serves a plain index on :80 so a fresh install is not a 404.
  Ports 80 and 443 are the point of a reverse proxy, not a default to change:
  they are where browsers go unprompted and where Lets Encrypt validates. On
  nucserver, nginx currently holds :80 serving only its stock default page,
  so it has to go first.'
