services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    # Host networking, because a reverse proxy exists to reach the other apps.
    # On a bridge network "127.0.0.1:8010" is the container's own loopback, not
    # the host's, so every published port on this machine would be invisible.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/caddy/sites:/etc/caddy/sites:ro
      - data:/data
      - config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
volumes:
  data:
  config:
