kind="systemd"        # inherits start/stop/update/delete/status
unit="homelab-backup.timer"
title="Nightly backup"
category="base"
desc="Backs up every installed app that holds data, every night at 03:30. Keeps the last 7 days and the last 4 Sundays in /var/lib/homelab/backups/nightly."
homepage=""
ports=""
stateful=0
needs_ram_mb=0
needs_disk_mb=2048
detect="unit:homelab-backup.timer"
purge_users="homelab-offsite"
purge_paths="/var/lib/homelab-offsite /usr/local/lib/homelab/offsite-pull"
notes='Runs `homelab backup --all` from a systemd timer. Each app is paused
  (docker pause), not stopped, for the length of its copy, so a database is
  copied in a consistent state and comes straight back. Caches declared as
  cache_volumes (model weights) are left out. Running = the timer is armed;
  degraded = the last run failed (journalctl -u homelab-backup.service).
  Offsite: another machine pulls the folder whenever it is on
  (`homelab offsite allow "<ssh key>"`, then apps/backup/files/install-puller.sh
  on that machine). Its key can only read the backups. Degraded also when an
  allowed machine has not pulled for 3 days. Deleting the app, even with
  --purge, keeps the backups themselves.'
