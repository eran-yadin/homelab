kind="compose"
title="qBittorrent"
category="media"
desc="The downloader for Radarr, Sonarr and Lidarr. Saves into the media folder's downloads/."
homepage="https://www.qbittorrent.org/"
ports="8090"
requires="docker"
stateful=1
needs_ram_mb=512
needs_disk_mb=1024
detect="container:qbittorrent"
notes='Web UI on 8090, not its usual 8080: AMP has 8080 on nucserver. The first
  login is admin with a one-time password the image prints at start:
  docker logs qbittorrent 2>&1 | grep -i password  -- then set your own in
  Tools > Options > WebUI. Set the default save path to /media/downloads.
  The peer port (6881) is not open to the internet (firewall, and CGNAT on
  IPv4), so downloads work but seeding to others is slow.'
