services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "${VW_PORT:-8222}:80"
    environment:
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-true}
      ADMIN_TOKEN: ${VW_ADMIN_TOKEN}
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:80/alive || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  data:
