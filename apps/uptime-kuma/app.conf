kind="compose"
title="Uptime Kuma"
category="ops"
desc="Watches your services and tells you when one goes down. Closes the silent-wedge gap."
homepage="https://github.com/louislam/uptime-kuma"
ports="3001"
requires="docker"
stateful=1
needs_ram_mb=256
detect="container:uptime-kuma"
notes='Worth having: a container can report Up while the service inside it is
  wedged. This checks the thing users actually touch -- the HTTP endpoint.'
