services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3001 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  data:
