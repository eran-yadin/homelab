kind="compose"
title="Manyfold"
category="files"
desc="Organise and browse your 3D print files. Interactive 3D preview, tags, duplicate detection."
homepage="https://manyfold.app/"
ports="3214"
requires="docker"
stateful=1
needs_ram_mb=1024
needs_disk_mb=2048
detect="container:manyfold"
oneshot="init-perms"   # runs once and exits; not counted as a running service
notes='Uses the all-in-one "solo" image, which bundles postgres and redis in
  one container -- fewer moving parts on a small box. Point MODELS_DIR in the
  generated .env at your STL/3MF library, then restart. The standard image
  splits the database out if you ever outgrow this.'
