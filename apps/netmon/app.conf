kind="systemd"        # inherits start/stop/update/delete/status/backup/restore
unit="netmon.service"
# the web UI and the root-side helper that lets it start/stop/restart netmon
extra_units="netmon-web.service netmon-control.path"
title="netmon"
category="network"
desc="Continuous latency and packet-loss monitor. Pings your gateway, your ISP edge and public resolvers, keeps the history in SQLite, and shows it in a web UI."
ports="8095"
stateful=1
needs_ram_mb=128
needs_disk_mb=512
detect="unit:netmon.service path:/opt/netmon/netmon.py"
backup_paths="/var/lib/netmon"
purge_paths="/opt/netmon /var/lib/netmon /var/log/netmon"
purge_users="netmon"
notes="Ported from nucserver. The gateway address is detected at install time
  rather than hardcoded, so this works on a network it has never seen.
  Runs as an unprivileged system user with CAP_NET_RAW and nothing else.
  The web UI (port 8095) reads the database read-only. Its settings go to
  /var/lib/netmon/settings.env; start/stop/restart requests go through
  netmon-control.path, the only part that runs as root."
