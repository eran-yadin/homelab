kind="compose"
title="Ollama"
category="ai"
desc="Runs language models locally. Text and vision models; an OpenAI-compatible API on :11434."
homepage="https://ollama.com/"
ports="11434"
requires="docker"
stateful=1
needs_ram_mb=4096
needs_disk_mb=20480
detect="container:ollama"
health_url="http://127.0.0.1:11434/api/version"
notes='Model weights are the disk cost, not the image: one 8B model at Q4 is
  about 5 GB and they accumulate. needs_disk_mb assumes a handful.

  What decides whether this is useful is VRAM, and the installer says so at
  install time rather than leaving you to find out. Without an NVIDIA GPU and
  the container toolkit, Ollama runs on the CPU -- it works, but a 7B model
  answers at a few tokens a second, and on a 2-core box it is not usable for
  anything interactive.

  Not pinned to a version deliberately: unlike a database, ollama has no schema
  to migrate. Models are plain files in the volume and survive an upgrade.'
