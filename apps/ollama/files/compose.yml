services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - models:/root/.ollama          # weights live here; back this up or re-pull
    # No GPU stanza here. Requesting a device that is not present is a hard
    # start failure, so download.sh writes compose.override.yml only when this
    # host has both an NVIDIA GPU and the container toolkit.
    healthcheck:
      test: ["CMD-SHELL", "ollama --version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  models:
