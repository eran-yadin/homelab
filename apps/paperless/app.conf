kind="compose"        # inherits download/start/stop/update/delete/status/backup/restore
title="Paperless-ngx"
category="documents"
desc="Scan, OCR and search your paper. Hebrew + English OCR."
homepage="https://docs.paperless-ngx.com/"
ports="8010"
requires="docker"
stateful=1
needs_ram_mb=1024
needs_disk_mb=4096
detect="container:paperless-webserver-1 container:paperless-webserver"
notes="Ported from nucserver. Four fixes applied vs the original compose:
  secret key and DB password are generated per-install instead of hardcoded,
  and db/broker gained healthchecks (without them a wedged postgres still
  reports Up). The image is built locally to add tesseract-ocr-heb."
