kind="compose"        # inherits download/start/stop/update/delete/status/backup/restore
title="Immich"
category="media"
desc="Photos and videos from your phone, backed up here and searchable. A Google Photos you own."
homepage="https://immich.app/"
ports="2283"
requires="docker"
stateful=1
needs_ram_mb=4096     # the machine-learning service alone wants ~2 GB when a job runs
needs_disk_mb=8192    # images ~2.5 GB, ML models ~1 GB, then whatever you upload
detect="container:immich_server"   # probes are ANDed, so list one name, not alternatives
health_url="http://127.0.0.1:2283/api/server/ping"
notes='Four containers: server, machine learning, valkey (redis) and postgres
  with the vector extension. The compose file is the upstream release file
  with three changes: data lives in named volumes (library, pgdata,
  model-cache) so backup/restore and --purge work like every other app; the
  environment is passed explicitly instead of via env_file, because the
  engine hands compose an env file for interpolation only; and the version
  is pinned in env.template, since an Immich release can migrate the
  database and mobile apps must match the server.

  Sign up in the browser on first visit: the first account becomes admin.
  Then install the mobile app and point it at http://<this host>:2283.

  The photo library is a docker volume (immich_library). backup archives it
  whole, so a backup is as big as your photos. Hardware acceleration for
  transcoding and ML is not enabled; the NUC would need the openvino image
  and /dev/dri passed through, a later step.'
