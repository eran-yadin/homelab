kind="systemd"        # inherits stop/update/delete; start.sh and status.sh add the safety net
unit="homelab-firewall.service"
title="Firewall"
category="network"
desc="Only the home network and the tailnet can reach this box. Closes everything else, including public IPv6, which CGNAT does not cover."
homepage=""
ports=""
stateful=0
needs_ram_mb=0
needs_disk_mb=0
detect="unit:homelab-firewall.service"
purge_paths="/etc/homelab/firewall.conf /etc/homelab/firewall.nft"
notes='One nftables table (inet homelab), next to docker and tailscale rather than
  replacing them. Lets in: loopback, replies, ping, the tailnet (tailscale0),
  the LAN subnet, containers, and tailscale direct connections (udp 41641).
  Drops everything else, on the host and towards containers.
  Settings: /etc/homelab/firewall.conf (written once with what was detected;
  `homelab update firewall --apply` regenerates the rules from it).
  Safety net: every start arms a 3-minute rollback that turns the firewall
  off again. Check you can still get in, then: homelab confirm firewall --apply'
