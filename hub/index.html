<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUC Homelab Hub</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080d;
    --bg2: #0d1018;
    --bg3: #111520;
    --border: #1c2235;
    --border2: #263047;
    --text: #c8d4e8;
    --muted: #5a6a88;
    --amber: #f5a623;
    --amber-dim: #3d2800;
    --green: #2ecc71;
    --green-dim: #0a2d1a;
    --red: #e74c3c;
    --red-dim: #2d0a0a;
    --purple: #9b59b6;
    --teal: #1abc9c;
    --blue: #3498db;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    background-image:
      linear-gradient(rgba(245,166,35,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,166,35,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 2rem;
    border-bottom: 1px solid var(--border);
    background: rgba(13,16,24,0.95);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .brand-icon {
    width: 36px;
    height: 36px;
    border: 1.5px solid var(--amber);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .brand-icon::before {
    content: '';
    position: absolute;
    inset: 3px;
    background: var(--amber);
    opacity: 0.15;
  }

  .brand-icon svg { position: relative; }

  .brand-text h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: #fff;
    text-transform: uppercase;
  }

  .brand-text p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--amber);
    letter-spacing: 0.1em;
  }

  .refresh-btn {
    background: none;
    border: 1px solid var(--border2);
    color: var(--muted);
    padding: 0.35rem 0.8rem;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .refresh-btn:hover {
    border-color: var(--amber);
    color: var(--amber);
  }

  .refresh-btn.spinning svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { max-width: 1400px; margin: 0 auto; padding: 2rem; }

  .sys-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .stat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 1rem 1.25rem;
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--amber);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.6s ease;
  }

  .stat-card.loaded::before { transform: scaleX(1); }

  .stat-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    margin-bottom: 0.4rem;
  }

  .stat-value span { font-size: 0.9rem; color: var(--muted); }

  .stat-bar-wrap {
    height: 3px;
    background: var(--border);
    margin-top: 0.6rem;
    overflow: hidden;
  }

  .stat-bar {
    height: 100%;
    background: var(--amber);
    transition: width 0.8s ease;
  }

  .stat-bar.warn { background: #e67e22; }
  .stat-bar.danger { background: var(--red); }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }

  .section-title {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .section-title::before {
    content: '';
    display: inline-block;
    width: 20px;
    height: 1px;
    background: var(--amber);
  }

  .filter-tabs {
    display: flex;
    gap: 0.5rem;
  }

  .filter-tab {
    padding: 0.25rem 0.75rem;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-tab:hover { color: var(--text); border-color: var(--border2); }
  .filter-tab.active {
    background: var(--amber);
    border-color: var(--amber);
    color: #000;
  }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }

  .svc-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 1.25rem;
    position: relative;
    transition: border-color 0.2s, transform 0.15s;
    overflow: hidden;
  }

  .svc-card:hover {
    border-color: var(--border2);
    transform: translateY(-1px);
  }

  .svc-card.hidden { display: none; }

  .svc-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
  }

  .svc-card[data-group="gaming"]::after { background: var(--purple); }
  .svc-card[data-group="media"]::after { background: var(--teal); }
  .svc-card[data-group="productivity"]::after { background: var(--blue); }
  .svc-card[data-group="system"]::after { background: var(--muted); }
  .svc-card[data-group="ai"]::after { background: var(--amber); }

  .svc-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .svc-name {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #fff;
    text-transform: uppercase;
  }

  .svc-desc {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.15rem;
    font-weight: 500;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    margin-top: 4px;
    position: relative;
  }

  .status-dot.up {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse-green 2.5s infinite;
  }

  .status-dot.down { background: var(--red); }
  .status-dot.unknown { background: var(--muted); }

  @keyframes pulse-green {
    0%, 100% { box-shadow: 0 0 4px var(--green); }
    50% { box-shadow: 0 0 12px var(--green), 0 0 20px rgba(46,204,113,0.3); }
  }

  .svc-meta {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .svc-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.2rem 0.5rem;
    border: 1px solid;
  }

  .svc-badge.gaming { color: var(--purple); border-color: rgba(155,89,182,0.4); background: rgba(155,89,182,0.08); }
  .svc-badge.media { color: var(--teal); border-color: rgba(26,188,156,0.4); background: rgba(26,188,156,0.08); }
  .svc-badge.productivity { color: var(--blue); border-color: rgba(52,152,219,0.4); background: rgba(52,152,219,0.08); }
  .svc-badge.system { color: var(--muted); border-color: rgba(90,106,136,0.4); background: rgba(90,106,136,0.08); }
  .svc-badge.ai { color: var(--amber); border-color: rgba(245,166,35,0.4); background: rgba(245,166,35,0.08); }

  .svc-port {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
  }

  .status-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .status-text.up { color: var(--green); }
  .status-text.down { color: var(--red); }
  .status-text.unknown { color: var(--muted); }

  .svc-actions {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.3rem 0.7rem;
    border: 1px solid;
    cursor: pointer;
    transition: all 0.15s;
    background: none;
  }

  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-start { color: var(--green); border-color: rgba(46,204,113,0.4); }
  .btn-start:hover:not(:disabled) { background: var(--green-dim); border-color: var(--green); }

  .btn-stop { color: var(--red); border-color: rgba(231,76,60,0.4); }
  .btn-stop:hover:not(:disabled) { background: var(--red-dim); border-color: var(--red); }

  .btn-restart { color: var(--amber); border-color: rgba(245,166,35,0.4); }
  .btn-restart:hover:not(:disabled) { background: var(--amber-dim); border-color: var(--amber); }

  .btn-open {
    color: #fff;
    border-color: var(--border2);
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    text-decoration: none;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.3rem 0.7rem;
  }

  .btn-open:hover { border-color: var(--amber); color: var(--amber); }
  .btn-open.disabled { opacity: 0.3; pointer-events: none; }

  .toast-container {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    z-index: 999;
  }

  .toast {
    background: var(--bg3);
    border: 1px solid var(--border2);
    padding: 0.6rem 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text);
    animation: slide-in 0.2s ease;
    max-width: 320px;
  }

  .toast.success { border-left: 3px solid var(--green); }
  .toast.error { border-left: 3px solid var(--red); }
  .toast.info { border-left: 3px solid var(--amber); }

  @keyframes slide-in {
    from { transform: translateX(20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .last-update {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    text-align: right;
    margin-top: 1.5rem;
    letter-spacing: 0.05em;
  }

  @media (max-width: 768px) {
    .sys-bar { grid-template-columns: repeat(2, 1fr); }
    header { padding: 1rem; }
    main { padding: 1rem; }
  }

  /* --- additions: link mode, search, reboot, install ------------------ */

  .link-toggle {
    display: flex; border: 1px solid var(--border2); border-radius: 4px;
    overflow: hidden; background: var(--bg3);
  }
  .link-opt {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
    letter-spacing: 0.08em; text-transform: uppercase; padding: 0.4rem 0.7rem;
    transition: all 0.15s;
  }
  .link-opt:hover:not(:disabled) { color: var(--text); background: var(--bg2); }
  .link-opt.active { background: var(--amber); color: #07080d; font-weight: 700; }
  .link-opt:disabled { opacity: 0.35; cursor: not-allowed; }

  .danger-btn {
    background: var(--red-dim); border: 1px solid var(--red); color: var(--red);
    font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
    letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
    padding: 0.45rem 0.8rem; border-radius: 4px; transition: all 0.15s;
  }
  .danger-btn:hover { background: var(--red); color: #fff; }

  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-input {
    background: var(--bg3); border: 1px solid var(--border2); color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
    padding: 0.4rem 0.7rem 0.4rem 1.8rem; border-radius: 4px; width: 200px;
    outline: none; transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--amber); }
  .search-input::placeholder { color: var(--muted); }
  .search-icon { position: absolute; left: 0.6rem; opacity: 0.5; pointer-events: none; }

  .status-dot.warn { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .status-text.warn { color: var(--amber); }

  .btn-install {
    background: var(--amber-dim); border-color: var(--amber); color: var(--amber);
  }
  .btn-install:hover:not(:disabled) { background: var(--amber); color: #07080d; }
  .btn-copy { background: var(--bg3); border-color: var(--border2); color: var(--muted); }
  .btn-copy:hover { color: var(--text); border-color: var(--amber); }

  /* categories the catalog can produce */
  .svc-badge.base      { background: rgba(52,152,219,0.12); color: var(--blue);   border-color: rgba(52,152,219,0.3); }
  .svc-badge.documents { background: rgba(26,188,156,0.12); color: var(--teal);   border-color: rgba(26,188,156,0.3); }
  .svc-badge.network   { background: rgba(155,89,182,0.12); color: var(--purple); border-color: rgba(155,89,182,0.3); }
  .svc-badge.misc      { background: rgba(90,106,136,0.12); color: var(--muted);  border-color: rgba(90,106,136,0.3); }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(7,8,13,0.85); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 500;
  }
  .modal-backdrop.show { display: flex; }
  .modal-card {
    background: var(--bg2); border: 1px solid var(--red); border-radius: 6px;
    padding: 1.5rem; max-width: 420px; width: 90%;
  }
  .modal-card h3 {
    font-family: 'JetBrains Mono', monospace; color: var(--red);
    font-size: 0.9rem; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.8rem;
  }
  .modal-card p { color: var(--text); font-size: 0.95rem; margin-bottom: 1.2rem; line-height: 1.5; }
  .modal-actions { display: flex; gap: 0.6rem; justify-content: flex-end; }

  .log-output {
    font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted);
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 0.5rem; margin-top: 0.6rem; max-height: 130px; overflow-y: auto;
    white-space: pre-wrap; display: none;
  }
  .log-output.show { display: block; }

</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <rect x="1" y="1" width="16" height="16" stroke="#f5a623" stroke-width="1.5" fill="none"/>
        <rect x="4" y="4" width="4" height="4" fill="#f5a623" opacity="0.8"/>
        <rect x="10" y="4" width="4" height="4" fill="#f5a623" opacity="0.4"/>
        <rect x="4" y="10" width="4" height="4" fill="#f5a623" opacity="0.4"/>
        <rect x="10" y="10" width="4" height="4" fill="#f5a623" opacity="0.8"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>NUC Homelab</h1>
      <p class="mono" id="brand-sub">connecting…</p>
    </div>
  </div>
  <div class="header-right">
    <div class="link-toggle" title="Which address the Open buttons use">
      <button class="link-opt active" id="mode-local"     onclick="setLinkMode('local')">Local</button>
      <button class="link-opt"        id="mode-tailscale" onclick="setLinkMode('tailscale')">Tailscale</button>
    </div>
    <button class="danger-btn" onclick="askReboot()" title="Reboot the server">Reboot</button>
    <span class="clock" id="clock">--:--:--</span>
    <button class="refresh-btn" id="refresh-btn" onclick="refresh()">
      <svg id="refresh-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" style="display:inline;vertical-align:middle;margin-right:4px">
        <path d="M10 6A4 4 0 1 1 6 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M6 2L8 0M6 2L8 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Refresh
    </button>
  </div>
</header>

<main>
  <div class="sys-bar">
    <div class="stat-card" id="stat-cpu">
      <div class="stat-label">CPU Load</div>
      <div class="stat-value mono" id="cpu-val">—<span>%</span></div>
      <div class="stat-bar-wrap"><div class="stat-bar" id="cpu-bar" style="width:0%"></div></div>
    </div>
    <div class="stat-card" id="stat-ram">
      <div class="stat-label">Memory</div>
      <div class="stat-value mono" id="ram-val">—<span> GB</span></div>
      <div class="stat-bar-wrap"><div class="stat-bar" id="ram-bar" style="width:0%"></div></div>
    </div>
    <div class="stat-card" id="stat-disk">
      <div class="stat-label">Disk</div>
      <div class="stat-value mono" id="disk-val">—<span> GB</span></div>
      <div class="stat-bar-wrap"><div class="stat-bar" id="disk-bar" style="width:0%"></div></div>
    </div>
    <div class="stat-card" id="stat-uptime">
      <div class="stat-label">Uptime</div>
      <div class="stat-value mono" id="uptime-val" style="font-size:1.2rem">—</div>
      <div class="stat-bar-wrap"><div class="stat-bar" style="width:100%;background:var(--muted)"></div></div>
    </div>
  </div>

  <div class="section-header">
    <div class="section-title">Services</div>
    <div style="display:flex;gap:0.8rem;align-items:center;flex-wrap:wrap">
      <div class="filter-tabs" id="filter-tabs"></div>
      <div class="search-wrap">
        <svg class="search-icon" width="11" height="11" viewBox="0 0 11 11" fill="none">
          <circle cx="4.5" cy="4.5" r="3.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M7.5 7.5L10 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input class="search-input mono" id="search" type="search"
               placeholder="filter…  (press /)" oninput="applyFilters()">
      </div>
    </div>
  </div>

  <div class="services-grid" id="services-grid"></div>
  <div id="empty-note" class="last-update" style="display:none">Nothing matches that filter.</div>

  <div class="last-update">Last update: <span id="last-update-time">never</span> — auto-refresh every 30s</div>
</main>

<div class="modal-backdrop" id="reboot-modal">
  <div class="modal-card">
    <h3>Reboot server?</h3>
    <p>Every service on this machine goes down for a minute or two.
       Anything still writing to disk is interrupted.</p>
    <div class="modal-actions">
      <button class="btn btn-open" onclick="closeReboot()">Cancel</button>
      <button class="danger-btn" onclick="doReboot()">Yes, reboot</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
const API = '';

let CONFIG = [];              // from /api/config
let NET = {};                 // addresses reported by the backend
let currentFilter = localStorage.getItem('hub.filter') || 'all';
let linkMode = localStorage.getItem('hub.linkMode') || 'local';
let refreshTimer;
let bootTime = null;          // /proc btime, used to confirm a reboot happened

/* ---------------------------------------------------------------- utils */

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), type === 'error' ? 7000 : 3500);
}

function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function statBar(pct) { return pct > 85 ? 'danger' : pct > 65 ? 'warn' : ''; }

/* ------------------------------------------------------------ link mode */

function urlFor(svc) {
  const u = svc.urls || {};
  return u[linkMode] || u.local || null;
}

function setLinkMode(mode) {
  if (mode === 'tailscale' && !NET.tailscale_up) {
    toast('Tailscale is not up on this server', 'error');
    return;
  }
  linkMode = mode;
  localStorage.setItem('hub.linkMode', mode);
  document.getElementById('mode-local').classList.toggle('active', mode === 'local');
  document.getElementById('mode-tailscale').classList.toggle('active', mode === 'tailscale');
  // rewrite the Open links in place; no reload needed
  CONFIG.forEach(svc => {
    const a = document.getElementById(`open-${svc.id}`);
    if (!a) return;
    const url = urlFor(svc);
    if (url) { a.href = url; a.title = url; }
  });
}

function copyLink(id) {
  const svc = CONFIG.find(s => s.id === id);
  const url = svc && urlFor(svc);
  if (!url) return;
  navigator.clipboard.writeText(url)
    .then(() => toast(`Copied ${url}`, 'success'))
    .catch(() => toast('Could not copy', 'error'));
}

/* -------------------------------------------------------------- filters */

function setFilter(f) {
  currentFilter = f;
  localStorage.setItem('hub.filter', f);
  document.querySelectorAll('.filter-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.filter === f));
  applyFilters();
}

function applyFilters() {
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  let shown = 0;
  CONFIG.forEach(svc => {
    const card = document.getElementById(`card-${svc.id}`);
    if (!card) return;
    const matchGroup = currentFilter === 'all' || svc.group === currentFilter;
    const matchText = !q ||
      svc.name.toLowerCase().includes(q) ||
      svc.id.toLowerCase().includes(q) ||
      (svc.desc || '').toLowerCase().includes(q);
    const show = matchGroup && matchText;
    card.classList.toggle('hidden', !show);
    if (show) shown++;
  });
  document.getElementById('empty-note').style.display = shown ? 'none' : 'block';
}

function buildTabs() {
  const groups = [...new Set(CONFIG.map(s => s.group))].sort();
  const el = document.getElementById('filter-tabs');
  el.innerHTML = ['all', ...groups].map(g =>
    `<button class="filter-tab" data-filter="${g}" onclick="setFilter('${g}')">${g}</button>`
  ).join('');
}

/* --------------------------------------------------------------- system */

function updateSystem(sys) {
  document.getElementById('cpu-val').innerHTML = `${sys.cpu}<span>%</span>`;
  const cpuBar = document.getElementById('cpu-bar');
  cpuBar.style.width = sys.cpu + '%';
  cpuBar.className = 'stat-bar ' + statBar(sys.cpu);
  document.getElementById('stat-cpu').title =
    `load ${sys.load ?? '?'} across ${sys.cores ?? '?'} cores` +
    (sys.temps && sys.temps.cpu ? ` — ${sys.temps.cpu}°C` : '');

  document.getElementById('ram-val').innerHTML = `${sys.ram_used}<span>/${sys.ram_total} GB</span>`;
  const ramBar = document.getElementById('ram-bar');
  ramBar.style.width = sys.ram_pct + '%';
  ramBar.className = 'stat-bar ' + statBar(sys.ram_pct);

  document.getElementById('disk-val').innerHTML = `${sys.disk_used}<span>/${sys.disk_total} GB</span>`;
  const diskBar = document.getElementById('disk-bar');
  diskBar.style.width = sys.disk_pct + '%';
  diskBar.className = 'stat-bar ' + statBar(sys.disk_pct);

  document.getElementById('uptime-val').textContent = sys.uptime;
  ['stat-cpu','stat-ram','stat-disk','stat-uptime'].forEach(id =>
    document.getElementById(id).classList.add('loaded'));
}

function updateNet(net) {
  NET = net || {};
  const bits = [NET.hostname, NET.local_ip].filter(Boolean).join(' — ');
  document.getElementById('brand-sub').textContent = bits || 'unknown host';
  const tsBtn = document.getElementById('mode-tailscale');
  tsBtn.disabled = !NET.tailscale_up;
  tsBtn.title = NET.tailscale_up
    ? `via ${NET.tailscale_name || NET.tailscale_ip}`
    : 'Tailscale is not up on this server';
  if (linkMode === 'tailscale' && !NET.tailscale_up) setLinkMode('local');
  else setLinkMode(linkMode);
}

/* -------------------------------------------------------------- statuses */

// homelab state -> how the card should read
const STATE_UI = {
  running:    {dot:'up',      text:'ONLINE'},
  degraded:   {dot:'warn',    text:'DEGRADED'},
  stopped:    {dot:'down',    text:'STOPPED'},
  downloaded: {dot:'unknown', text:'INSTALLED'},
  absent:     {dot:'unknown', text:'NOT INSTALLED'},
};

function updateServiceStatuses(statuses) {
  statuses.forEach(s => {
    const id = s.app;
    const dot = document.getElementById(`dot-${id}`);
    if (!dot) return;
    const txt = document.getElementById(`status-txt-${id}`);
    const meta = STATE_UI[s.state] || {dot:'unknown', text:(s.state||'?').toUpperCase()};

    let label = meta.text;
    let cls = meta.dot;
    if (s.state === 'running' && s.health === 'starting') { cls = 'warn'; label = 'STARTING'; }
    if (s.health === 'unhealthy') { cls = 'warn'; label = 'UNHEALTHY'; }

    dot.className = 'status-dot ' + cls;
    txt.className = 'status-text ' + cls;
    txt.textContent = label;
    if (s.containers) txt.title = `${s.containers} containers`;

    const running = s.state === 'running' || s.state === 'degraded';
    const installed = s.installed || s.state === 'downloaded';

    const b = a => document.getElementById(`${a}-${id}`);
    if (b('install')) b('install').style.display = installed ? 'none' : '';
    ['start','stop','restart'].forEach(a => {
      if (b(a)) b(a).style.display = installed ? '' : 'none';
    });
    if (b('start'))   b('start').disabled   = running;
    if (b('stop'))    b('stop').disabled    = !running;
    if (b('restart')) b('restart').disabled = !running;

    const open = document.getElementById(`open-${id}`);
    if (open) open.classList.toggle('disabled', !running);
  });
}

/* --------------------------------------------------------------- actions */

async function controlService(id, action) {
  const verb = {start:'Starting',stop:'Stopping',restart:'Restarting',
                update:'Updating',install:'Installing'}[action];
  toast(`${verb} ${id}…`, 'info');
  const btns = ['start','stop','restart','install','update']
    .map(a => document.getElementById(`${a}-${id}`));
  btns.forEach(b => b && (b.disabled = true));
  const logEl = document.getElementById(`log-${id}`);

  try {
    const res = await fetch(`${API}/api/control`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({service: id, action})
    });
    const data = await res.json();
    if (data.success) {
      toast(data.noop ? `${id}: already ${action === 'stop' ? 'stopped' : 'running'}`
                      : `${id}: ${action} OK`, 'success');
      if (logEl) logEl.classList.remove('show');
      if (action === 'install') { await loadConfig(); }
    } else {
      toast(`${id}: ${action} failed`, 'error');
      if (logEl && (data.output || data.error)) {
        logEl.textContent = data.output || data.error;
        logEl.classList.add('show');
      }
    }
  } catch (e) {
    toast(`Failed: ${e.message}`, 'error');
  } finally {
    await refresh();
  }
}

/* ---------------------------------------------------------------- reboot */

function askReboot()   { document.getElementById('reboot-modal').classList.add('show'); }
function closeReboot() { document.getElementById('reboot-modal').classList.remove('show'); }

async function doReboot() {
  closeReboot();
  toast('Rebooting the server…', 'info');
  try {
    const res = await fetch(`${API}/api/system`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'reboot'})
    });
    const data = await res.json();
    if (data.success) {
      toast('Reboot scheduled — this page will go offline shortly', 'success');
      clearTimeout(refreshTimer);
      setTimeout(waitForServer, 8000);
    } else {
      toast(`Reboot failed: ${data.error || 'unknown'}`, 'error');
    }
  } catch (e) {
    toast(`Reboot request failed: ${e.message}`, 'error');
  }
}

// Poll until the box answers again AND reports a new boot time. Without the
// boot-time check this races the 3s delay: the server is still up when polling
// starts, so the first reply looks like "it's back" before it ever went down.
async function waitForServer() {
  const el = document.getElementById('last-update-time');
  el.textContent = 'server rebooting…';
  try {
    const res = await fetch(`${API}/api/status`, {cache: 'no-store'});
    if (res.ok) {
      const data = await res.json();
      const bt = data.system && data.system.boot_time;
      if (bootTime === null || bt === undefined || bt !== bootTime) {
        toast('Server is back', 'success');
        bootTime = bt ?? bootTime;
        return refresh();
      }
    }
  } catch (e) { /* still down, keep waiting */ }
  setTimeout(waitForServer, 5000);
}

/* ----------------------------------------------------------------- cards */

function buildCard(svc) {
  const url = urlFor(svc);
  const portText = svc.port ? `:${svc.port}` : 'no port';
  const openBtn = url
    ? `<a class="btn btn-open disabled" id="open-${svc.id}" href="${url}" title="${url}" target="_blank">Open <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 8L8 2M8 2H4M8 2V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>
       <button class="btn btn-copy" onclick="copyLink('${svc.id}')" title="Copy link">Copy</button>`
    : `<span class="btn btn-open disabled">No UI</span>`;

  return `
    <div class="svc-card" id="card-${svc.id}" data-group="${svc.group}">
      <div class="svc-top">
        <div>
          <div class="svc-name">${svc.name}</div>
          <div class="svc-desc">${svc.desc}</div>
        </div>
        <div id="dot-${svc.id}" class="status-dot unknown"></div>
      </div>
      <div class="svc-meta">
        <span class="svc-badge ${svc.group}">${svc.group}</span>
        <span class="svc-port mono">${portText}</span>
        <span id="status-txt-${svc.id}" class="status-text unknown">—</span>
      </div>
      <div class="svc-actions">
        <button class="btn btn-install" id="install-${svc.id}" style="display:none"
                onclick="controlService('${svc.id}','install')">Install</button>
        <button class="btn btn-start"   id="start-${svc.id}"   onclick="controlService('${svc.id}','start')" disabled>Start</button>
        <button class="btn btn-stop"    id="stop-${svc.id}"    onclick="controlService('${svc.id}','stop')" disabled>Stop</button>
        <button class="btn btn-restart" id="restart-${svc.id}" onclick="controlService('${svc.id}','restart')" disabled>Restart</button>
        ${openBtn}
      </div>
      <div class="log-output mono" id="log-${svc.id}"></div>
    </div>
  `;
}

async function loadConfig() {
  const res = await fetch(`${API}/api/config`);
  CONFIG = await res.json();
  document.getElementById('services-grid').innerHTML = CONFIG.map(buildCard).join('');
  buildTabs();
  setFilter(CONFIG.some(s => s.group === currentFilter) ? currentFilter : 'all');
}

async function refresh() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  try {
    const res = await fetch(`${API}/api/status`, {cache: 'no-store'});
    const data = await res.json();
    updateNet(data.net);
    updateSystem(data.system);
    if (data.system && data.system.boot_time) bootTime = data.system.boot_time;
    updateServiceStatuses(data.services);
    document.getElementById('last-update-time').textContent =
      new Date().toLocaleTimeString('en-GB');
  } catch (e) {
    toast('Failed to reach backend — is homelab-hub running?', 'error');
  } finally {
    btn.classList.remove('spinning');
  }
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refresh, 30000);
}

/* ------------------------------------------------------------- shortcuts */

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeReboot(); document.activeElement.blur(); return; }
  if (e.target.tagName === 'INPUT') return;
  if (e.key === '/') { e.preventDefault(); document.getElementById('search').focus(); }
  if (e.key === 'r') refresh();
  if (e.key === 'l') setLinkMode(linkMode === 'local' ? 'tailscale' : 'local');
});

(async () => {
  setInterval(updateClock, 1000);
  updateClock();
  await loadConfig().catch(() =>
    toast('Could not load the catalog — is homelab-hub running?', 'error'));
  await refresh();
})();
</script>
